<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Quiz App</title>
  </head>
  <body>
    <h2>Quiz App</h2>
    <div id="timerTrack"><div id="timerBar" style="width: 100%"></div></div>
    <p id="timerText">Time left: 15s</p>
    <p id="progress">Question 1 / 5</p>
    <h3 id="question"></h3>
    <div id="options"></div>
    <p id="feedback" style="font-weight: bold"></p>

    <div id="resultBox">
      <h2>Quiz Complete!</h2>
      <p id="finalScore"></p>
      <button onclick="restartQuiz()">Restart</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
